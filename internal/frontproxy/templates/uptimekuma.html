<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uptime Kuma</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #0d1117;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px;
    background: #161b22; border-bottom: 1px solid #21262d;
  }
  header .badge {
    width: 30px; height: 30px; border-radius: 50%; background: #1f6feb;
    display: flex; align-items: center; justify-content: center;
  }
  header .badge svg { width: 18px; height: 18px; }
  header span { font-size: 18px; font-weight: 700; color: #e6edf3; }
  .wrap { min-height: calc(100vh - 56px); display: flex; align-items: center; justify-content: center; padding: 24px; }
  form { width: 340px; max-width: calc(100vw - 32px); }
  input[type=text], input[type=password] {
    display: block; width: 100%; padding: 12px 18px; font-size: 14px; border-radius: 999px;
    border: 1px solid #30363d; background: #161b22; color: #e6edf3; margin-top: 14px;
  }
  input[type=text]:first-child { margin-top: 0; }
  input::placeholder { color: #6e7681; }
  input:focus { outline: none; border-color: #2f81f7; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: #c9d1d9; }
  .error {
    display: none; margin-top: 14px; padding: 9px 14px; border-radius: 8px;
    background: #3b1219; border: 1px solid #7d2933; color: #ff9492; font-size: 13px;
  }
  .error.show { display: block; }
  button {
    margin-top: 20px; width: 100%; padding: 11px; border: none; border-radius: 999px;
    background: #2ecf9d; color: #04261c; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button:disabled { background: #1f4a3d; color: #4c6e63; cursor: default; }
  button:not(:disabled):hover { background: #29ba8e; }
</style>
</head>
<body>
<header>
  <div class="badge">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M8,10L10.5,12.5L16,7L17.5,8.5L10.5,15.5L6.5,11.5L8,10Z"/></svg>
  </div>
  <span>Uptime Kuma</span>
</header>
<div class="wrap">
  <form id="f" autocomplete="off">
    <input id="u" name="username" type="text" placeholder="Логин" autocapitalize="none" required>
    <input id="p" name="password" type="password" placeholder="Пароль" required>
    <label class="row"><input type="checkbox" id="r" checked style="width:auto"> Запомнить меня</label>
    <div class="error" id="err"></div>
    <button id="submit" type="submit">Вход в систему</button>
  </form>
</div>
<script>
(function () {
  "use strict";

  var base = "/socket.io/?EIO=4&transport=polling";

  function handshake() {
    return fetch(base).then(function (r) { return r.text(); });
  }

  function connect() {
    return fetch(base, { method: "POST", body: "40" });
  }

  var ackSeq = 0;
  function emitLogin(username, password) {
    var ackId = ackSeq++;
    var packet = "42" + ackId + JSON.stringify(["login", { username: username, password: password, token: "" }]);
    return fetch(base, { method: "POST", body: packet }).then(function (r) { return r.text(); }).then(function (text) {
      var m = /^43\d*(\[.*\])$/.exec(text);
      if (!m) { return null; }
      return JSON.parse(m[1])[0];
    });
  }

  var ready = handshake().then(connect);

  var messages = {
    authIncorrectCreds: "Неверное имя пользователя или пароль",
  };

  var form = document.getElementById("f");
  var err = document.getElementById("err");
  var submit = document.getElementById("submit");

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    err.classList.remove("show");
    submit.disabled = true;

    ready.then(function () {
      return emitLogin(document.getElementById("u").value, document.getElementById("p").value);
    }).then(function (result) {
      if (!result) { return; }
      err.textContent = result.msgi18n ? (messages[result.msg] || result.msg) : result.msg;
      err.classList.add("show");
    }).finally(function () {
      submit.disabled = false;
    });
  });
})();
</script>
</body>
</html>
