<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdGuard Home</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: #101113; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e8e9ea;
  }
  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 16px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
  .brand svg { width: 30px; height: 30px; }
  .brand .name { line-height: 1.1; }
  .brand .name b { font-size: 17px; letter-spacing: .03em; display: block; }
  .brand .name span { font-size: 10px; letter-spacing: .12em; color: #9a9ea3; display: block; }
  .card { width: 100%; max-width: 360px; padding: 28px; background: #1b1d20; border-radius: 6px; }
  label { display: block; font-size: 13px; margin: 0 0 8px; color: #d3d5d7; }
  .field { margin-bottom: 18px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #34373b; border-radius: 4px; font-size: 14px;
    background: #101113; color: #e8e9ea; }
  input::placeholder { color: #6b6f75; }
  input:focus { outline: none; border-color: #4f8c5b; }
  .field.invalid input { border-color: #d94c4c; }
  .hint { font-size: 12px; color: #d94c4c; margin-top: 6px; display: none; }
  .field.invalid .hint { display: block; }
  button { width: 100%; margin-top: 6px; padding: 11px; border: none; border-radius: 4px;
    background: #4f8c5b; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button:hover:not(:disabled) { background: #457b50; }
  .err { margin-top: 14px; padding: 8px 12px; border-radius: 4px; background: #3a1f1f; color: #ff9d9d;
    font-size: 13px; display: none; }
  .err.show { display: block; }
  .forgot { margin-top: 18px; font-size: 13px; }
  .forgot a { color: #5b9bd9; text-decoration: none; }
  footer { border-top: 1px solid #232528; padding: 18px 24px; font-size: 13px; color: #8a8f95; }
  .foot-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .foot-links { display: flex; align-items: center; gap: 18px; }
  .foot-links a { color: #8a8f95; text-decoration: none; }
  .report { border: 1px solid #3a5f8a; color: #5b9bd9 !important; border-radius: 4px; padding: 4px 10px; }
  .foot-right { display: flex; align-items: center; gap: 10px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 4px; border: 1px solid #34373b; background: transparent;
    color: #cfd2d5; display: flex; align-items: center; justify-content: center; cursor: default; }
  select { background: #1b1d20; color: #cfd2d5; border: 1px solid #34373b; border-radius: 4px; padding: 5px 8px; font-size: 13px; }
  .copyright { margin-top: 14px; }
  .copyright a { color: #8a8f95; }
</style>
</head>
<body>
  <div class="main">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3z" stroke="#4f8c5b" stroke-width="1.6"/>
        <path d="M8.5 12.2l2.4 2.4 4.6-4.8" stroke="#4f8c5b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="name"><b>ADGUARD</b><span>HOME</span></div>
    </div>
    <div class="card">
      <form id="f" autocomplete="off" novalidate>
        <div class="field" id="fu">
          <label for="u">Имя пользователя</label>
          <input id="u" name="name" autocomplete="username" placeholder="Введите имя пользователя">
          <div class="hint">Обязательное поле</div>
        </div>
        <div class="field" id="fp">
          <label for="p">Пароль</label>
          <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Введите пароль">
          <div class="hint">Обязательное поле</div>
        </div>
        <button id="btn" type="submit">Войти</button>
        <div class="err" id="err"></div>
      </form>
      <div class="forgot"><a href="#">Забыли пароль?</a></div>
    </div>
  </div>
  <footer>
    <div class="foot-row">
      <div class="foot-links">
        <a href="#">Главная</a>
        <a href="#">Политика конфиденциальности</a>
        <a href="#" class="report">Сообщить о проблеме</a>
      </div>
      <div class="foot-right">
        <span class="icon-btn">◐</span>
        <span class="icon-btn">☾</span>
        <span class="icon-btn">○</span>
        <select disabled><option>Русский</option></select>
      </div>
    </div>
    <div class="copyright">Все права защищены © 2026 <a href="#">AdGuard</a></div>
  </footer>
<script>
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var u = document.getElementById('u'), p = document.getElementById('p');
  var fu = document.getElementById('fu'), fp = document.getElementById('fp');
  fu.classList.toggle('invalid', u.value === '');
  fp.classList.toggle('invalid', p.value === '');
  if (u.value === '' || p.value === '') { return; }

  var btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.className = 'err';
  try {
    var res = await fetch('/control/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: u.value, password: p.value })
    });
    if (res.status === 429) {
      var retry = res.headers.get('Retry-After');
      err.textContent = retry ? 'Слишком много попыток. Повторите через ' + Math.ceil(retry / 60) + ' мин.' : 'Слишком много попыток. Повторите позже.';
      err.className = 'err show';
    } else if (!res.ok) {
      err.textContent = 'Неверное имя пользователя или пароль';
      err.className = 'err show';
    }
  } catch (e) {
    err.textContent = 'Ошибка сети'; err.className = 'err show';
  } finally {
    btn.disabled = false;
  }
});
['u', 'p'].forEach(function (id) {
  document.getElementById(id).addEventListener('input', function () {
    document.getElementById(id === 'u' ? 'fu' : 'fp').classList.remove('invalid');
  });
});
</script>
</body>
</html>
