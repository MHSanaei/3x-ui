<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jellyfin</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #101010; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #eee;
  }
  .card { width: 100%; max-width: 360px; padding: 40px 32px; background: #1c1c1c; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .logo { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #00a4dc; }
  .sub { text-align: center; color: #a2a2a2; font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; margin: 14px 0 6px; color: #cfcfcf; }
  input { width: 100%; padding: 9px 12px; border: 1px solid #3a3a3a; border-radius: 4px; font-size: 14px;
    background: #101010; color: #eee; }
  input:focus { outline: none; border-color: #00a4dc; }
  button { width: 100%; margin-top: 22px; padding: 10px; border: none; border-radius: 4px;
    background: #00a4dc; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button:hover:not(:disabled) { background: #0093c4; }
  .err { margin-top: 14px; padding: 8px 12px; border-radius: 4px; background: #3a1a1a; color: #ff9d9d;
    font-size: 13px; display: none; }
  .err.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">jellyfin</div>
    <p class="sub">Пожалуйста, войдите, чтобы продолжить</p>
    <form id="f" autocomplete="off">
      <label for="u">Имя пользователя</label>
      <input id="u" autocomplete="username" required>
      <label for="p">Пароль</label>
      <input id="p" type="password" autocomplete="current-password">
      <button id="btn" type="submit">Войти</button>
      <div class="err" id="err"></div>
    </form>
  </div>
<script>
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('btn'), err = document.getElementById('err');
  btn.disabled = true; err.className = 'err';
  try {
    var res = await fetch('/Users/AuthenticateByName', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'MediaBrowser Client="Jellyfin Web", Device="Browser", DeviceId="decoy", Version="10"'
      },
      body: JSON.stringify({ Username: document.getElementById('u').value, Pw: document.getElementById('p').value })
    });
    if (!res.ok) {
      var msg = 'Неверное имя пользователя или пароль';
      if (res.status === 429) {
        var retry = res.headers.get('Retry-After');
        msg = retry ? 'Слишком много попыток. Повторите через ' + Math.ceil(retry / 60) + ' мин.' : 'Слишком много попыток. Повторите позже.';
      }
      err.textContent = msg; err.className = 'err show';
    }
  } catch (e) {
    err.textContent = 'Ошибка сети'; err.className = 'err show';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
