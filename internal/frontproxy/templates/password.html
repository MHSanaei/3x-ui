<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Pick "password" "title" "Генератор паролей" "Надёжный пароль" "Создать пароль"}}</title>
<style>
:root { color-scheme: light dark; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font:16px/1.6 {{.Font}}; background:{{.Surface}}; color:{{.Ink}}; }
main { width:100%; max-width:{{.Wide}}rem; padding:{{.Pad}}px; }
h1 { font-size:1.3rem; margin:0 0 1rem; }
#pw { font-family:ui-monospace, Consolas, "Courier New", monospace; font-size:1.15rem;
  padding:.8rem .9rem; border-radius:{{.Radius}}px; background:rgba(128,128,128,.1);
  word-break:break-all; margin-bottom:1rem; min-height:1.4em; }
label { display:flex; align-items:center; gap:.6rem; margin-bottom:.6rem; font-size:.95rem; }
input[type=range] { flex:1; accent-color:{{.Accent}}; }
input[type=checkbox] { accent-color:{{.Accent}}; }
button { font:inherit; padding:.6rem 1.2rem; border:0; border-radius:{{.Radius}}px;
  background:{{.Accent}}; color:#fff; cursor:pointer; margin-top:.6rem; }
.hint { color:{{.Muted}}; font-size:.85rem; margin-top:.8rem; }
@media (prefers-color-scheme: dark) { body { background:#17171a; color:#e8e8ea; } }
</style>
</head>
<body>
<main>
<h1>{{.Pick "password" "head" "Генератор паролей" "Надёжный пароль" "Создать пароль"}}</h1>
<div id="pw"></div>
<label>Длина <input type="range" id="len" min="8" max="48" value="20"> <b id="lenv">20</b></label>
<label><input type="checkbox" id="dig" checked> Цифры</label>
<label><input type="checkbox" id="sym" checked> Спецсимволы</label>
<button id="go">{{.Pick "password" "btn" "Сгенерировать" "Новый пароль" "Обновить"}}</button>
<p class="hint">{{.Pick "password" "hint" "Пароль создаётся в браузере и никуда не отправляется." "Всё происходит локально, на вашем устройстве." "Ничего не покидает эту вкладку."}}</p>
</main>
<script>
(function () {
  var lower = 'abcdefghijkmnopqrstuvwxyz', upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  var digits = '23456789', symbols = '!@#$%^&*()-_=+?';
  var pw = document.getElementById('pw'), len = document.getElementById('len');
  var lenv = document.getElementById('lenv'), dig = document.getElementById('dig'), sym = document.getElementById('sym');
  function gen() {
    var pool = lower + upper + (dig.checked ? digits : '') + (sym.checked ? symbols : '');
    var n = parseInt(len.value, 10), bytes = new Uint32Array(n), out = '';
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    for (var i = 0; i < n; i++) out += pool[bytes[i] % pool.length];
    pw.textContent = out;
    lenv.textContent = n;
  }
  document.getElementById('go').addEventListener('click', gen);
  len.addEventListener('input', gen);
  dig.addEventListener('change', gen);
  sym.addEventListener('change', gen);
  gen();
})();
</script>
</body>
</html>
