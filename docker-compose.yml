services:
  3xui:
    image: 3x-ui-offline:local
    pull_policy: never
    container_name: 3xui_app
    networks:
      - panel
    ports:
      - "127.0.0.1:2053:2053"
    volumes:
      - ./db:/etc/x-ui
      - ./cert:/root/cert:ro
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
    restart: unless-stopped

networks:
  panel:
    internal: true
