name: Release 3X-UI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - "internal/Telemt/telemt.service"
      - "internal/Telemt/telemt-update.service"
      - "internal/Telemt/telemt-update.timer"
      - "internal/Telemt/telemt-update.sh"
      - "internal/Telemt/telemt.toml.example"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - ".github/workflows/release.yml"

jobs:
  frontend:
    name: Build frontend once
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: internal/web/dist
          if-no-files-found: error
          compression-level: 0

  build:
    needs: [frontend]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Restore Go compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-${{ matrix.platform }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-${{ matrix.platform }}-

      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: internal/web/dist

      - name: Build Linux package
        shell: bash
        run: |
          set -euo pipefail
          CURL_RETRY=(--retry 5 --retry-all-errors --retry-delay 3)
          fetch() { wget -q --tries=5 --waitretry=10 --retry-on-http-error=429,500,502,503 "$@"; }

          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}

          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH=x86-64 ;;
            arm64) BOOTLIN_ARCH=aarch64 ;;
            *) exit 1 ;;
          esac

          TARBALL_BASE="https://toolchains.bootlin.com/downloads/releases/toolchains/${BOOTLIN_ARCH}/tarballs/"
          TARBALL_URL=$(curl -fsSL "${CURL_RETRY[@]}" "$TARBALL_BASE" | grep -oE "${BOOTLIN_ARCH}--musl--stable-[^\"]+\.tar\.xz" | sort -r | head -n1)
          test -n "$TARBALL_URL"
          cd /tmp
          curl -fL -sS "${CURL_RETRY[@]}" -o "$(basename "$TARBALL_URL")" "$TARBALL_BASE/$TARBALL_URL"
          tar -xf "$(basename "$TARBALL_URL")"
          TOOLCHAIN_DIR=$(find . -maxdepth 1 -type d -name "${BOOTLIN_ARCH}--musl--stable-*" | head -n1)
          test -n "$TOOLCHAIN_DIR"
          export PATH="$(realpath "$TOOLCHAIN_DIR")/bin:$PATH"
          export CC=$(realpath "$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable | head -n1)")
          test -n "$CC"
          cd -

          LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -buildvcs=true -ldflags "$LDFLAGS" -o xui-release -v .

          rm -rf x-ui
          mkdir -p x-ui/bin
          mv xui-release x-ui/x-ui
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/
          cp internal/Telemt/telemt.service x-ui/
          cp internal/Telemt/telemt-update.service x-ui/
          cp internal/Telemt/telemt-update.timer x-ui/
          cp internal/Telemt/telemt-update.sh x-ui/
          cp internal/Telemt/telemt.toml.example x-ui/
          cp internal/Telemt/telemt-meko-fix.sh x-ui/
          cp internal/Telemt/telemt-meko-fix.service x-ui/
          cp x-ui.sh x-ui/
          cd x-ui/bin

          Xray_URL="https://github.com/XTLS/Xray-core/releases/download/v26.9.9/"
          if [[ "${{ matrix.platform }}" == amd64 ]]; then
            fetch "${Xray_URL}Xray-linux-64.zip"
            unzip -q Xray-linux-64.zip
            rm -f Xray-linux-64.zip
          else
            fetch "${Xray_URL}Xray-linux-arm64-v8a.zip"
            unzip -q Xray-linux-arm64-v8a.zip
            rm -f Xray-linux-arm64-v8a.zip
          fi

          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          fetch -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          fetch -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          fetch -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-${{ matrix.platform }}

          MTG_MULTI_VER=$(curl -sf "${CURL_RETRY[@]}" -o /dev/null -w '%{redirect_url}' https://github.com/mhsanaei/mtg-multi/releases/latest | sed -n 's#.*/releases/tag/##p')
          test -n "$MTG_MULTI_VER"
          MTG_PKG="mtg-multi-${MTG_MULTI_VER#v}-linux-${{ matrix.platform }}"
          curl -sfLRO "${CURL_RETRY[@]}" "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VER}/${MTG_PKG}.tar.gz"
          tar -xzf "${MTG_PKG}.tar.gz"
          mv "${MTG_PKG}/mtg-multi" "mtg-linux-${{ matrix.platform }}"
          rm -rf "$MTG_PKG" "${MTG_PKG}.tar.gz"

          case "${{ matrix.platform }}" in
            amd64) TELEMT_ARCH=x86_64 ; TUIC_ARCH=x86_64-unknown-linux-musl ;;
            arm64) TELEMT_ARCH=aarch64 ; TUIC_ARCH=aarch64-unknown-linux-musl ;;
          esac
          TELEMT_VER=$(curl -sf "${CURL_RETRY[@]}" -o /dev/null -w '%{redirect_url}' https://github.com/telemt/telemt/releases/latest | sed -n 's#.*/releases/tag/##p')
          test -n "$TELEMT_VER"
          TELEMT_PKG="telemt-${TELEMT_ARCH}-linux-musl.tar.gz"
          curl -sfLRO "${CURL_RETRY[@]}" "https://github.com/telemt/telemt/releases/download/${TELEMT_VER}/${TELEMT_PKG}"
          tar -xzf "$TELEMT_PKG"
          chmod +x telemt
          rm -f "$TELEMT_PKG"

          curl -sfLRo tuic-server "${CURL_RETRY[@]}" "https://github.com/EAimTY/tuic/releases/download/tuic-server-1.0.0/tuic-server-1.0.0-${TUIC_ARCH}"
          chmod +x tuic-server
          cd ../..

      - name: Package
        run: |
          tar -zcf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui
          sha256sum x-ui-linux-${{ matrix.platform }}.tar.gz > x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: x-ui-linux-${{ matrix.platform }}
          path: |
            x-ui-linux-${{ matrix.platform }}.tar.gz
            x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload stable release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: x-ui-linux-${{ matrix.platform }}.tar.gz*
          file_glob: true
          overwrite: true
          prerelease: false

  publish-dev:
    name: Publish rolling dev release
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dev-artifacts
          merge-multiple: true

      - name: Publish dev-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${COMMIT::8}"
          git tag -f dev-latest "$COMMIT"
          git push -f origin refs/tags/dev-latest
          if ! gh release edit dev-latest --prerelease --latest=false --title "Dev build $short" --notes "Rolling development build from main. commit=$COMMIT"; then
            gh release create dev-latest --prerelease --latest=false --target "$COMMIT" --title "Dev build $short" --notes "Rolling development build from main. commit=$COMMIT"
          fi
          gh release upload dev-latest dev-artifacts/*.tar.gz dev-artifacts/*.sha256 --clobber
