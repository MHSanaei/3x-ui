name: Publish 3x-ui-20261110 once

on:
  push:
    paths:
      - .github/workflows/publish-3x-ui-20261110-once.yml

permissions:
  actions: write
  contents: write

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel build pinned to pre-release package digest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run cancel 42769004601 || true
