name: Cancel obsolete rolling release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-obsolete-release.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: "${{ github.event.head_commit.message == 'ci: cancel obsolete rolling release' }}"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel the obsolete release run
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/42349215141/cancel"
