name: Dispatch stable rebuild

on:
  push:
    paths:
      - ".github/workflows/dispatch-stable-rebuild.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch stable release rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_ref=113176375a1d72a1bc2434a19f064af067e5c50a \
            -f release_tag=3x-ui-20261107
