name: Publish 3x-ui-20261107-r2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-3x-ui-20261107-r2.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish-tag:
    if: "${{ github.event.head_commit.message == 'release: publish 3x-ui-20261107-r2' }}"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: 3x-ui-20261107-r2
      RELEASE_COMMIT: af90cd02bba27564dcb0acde158b9c1031b0a11f
      BUILD_BRANCH: 3x-ui-20261107-r2-build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Start the isolated release build
        run: |
          set -euo pipefail
          test "$(git rev-parse "origin/${BUILD_BRANCH}")" = "${RELEASE_COMMIT}"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}")" = "${RELEASE_COMMIT}"
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${BUILD_BRANCH}"

      - name: Wait for release build and set release notes
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow release.yml --branch "${BUILD_BRANCH}" --event workflow_dispatch \
              --limit 5 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${RELEASE_COMMIT}\") | .databaseId" | head -n 1)"
            [[ -n "${run_id}" ]] && break
            sleep 5
          done
          [[ -n "${run_id}" ]]
          gh run watch "${run_id}" --repo "${GITHUB_REPOSITORY}" --exit-status
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --dir release-artifacts
          test "$(find release-artifacts -type f | wc -l)" -eq 16
          test "$(find release-artifacts -type f -name '*.sha256' | wc -l)" -eq 8
          while IFS= read -r checksum; do
            (
              cd "$(dirname "${checksum}")"
              sha256sum -c "$(basename "${checksum}")"
            )
          done < <(find release-artifacts -type f -name '*.sha256' -print)
          notes="Independent immutable update based on the IPv6/DNS hardening release.

          - Fixes the panel update lock remaining busy after a failed updater process or systemd unit exits without writing a final status.
          - Preserves dev-latest at dev+6d205a91.
          - Does not move or overwrite 3x-ui-20261107.
          - Includes Linux regression and race tests for the update lock."
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TAG}" --notes "${notes}" \
              --prerelease --latest=false
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --title "${RELEASE_TAG}" --notes "${notes}" \
              --prerelease --latest=false
          fi
          gh release upload "${RELEASE_TAG}" release-artifacts/*/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
          git push origin --delete "${BUILD_BRANCH}"

