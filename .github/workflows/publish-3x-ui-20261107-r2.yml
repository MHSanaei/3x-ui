name: Replace 3x-ui-20261107 with fixed build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-3x-ui-20261107-r2.yml"

permissions:
  actions: read
  contents: write

jobs:
  replace-release:
    if: "${{ github.event.head_commit.message == 'release: replace 3x-ui-20261107 with fixed build' }}"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "42350566796"
      RELEASE_TAG: 3x-ui-20261107
      STAGING_TAG: 3x-ui-20261107-r2
      RELEASE_COMMIT: af90cd02bba27564dcb0acde158b9c1031b0a11f
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and verify fixed build
        run: |
          set -euo pipefail
          test "$(gh run view "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json conclusion --jq '.conclusion')" = "success"
          test "$(gh run view "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json headSha --jq '.headSha')" = "${RELEASE_COMMIT}"
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --dir release-artifacts
          test "$(find release-artifacts -type f | wc -l)" -eq 16
          test "$(find release-artifacts -type f -name '*.sha256' | wc -l)" -eq 8
          while IFS= read -r checksum; do
            (
              cd "$(dirname "${checksum}")"
              sha256sum -c "$(basename "${checksum}")"
            )
          done < <(find release-artifacts -type f -name '*.sha256' -print)

      - name: Replace dated release and remove staging release
        run: |
          set -euo pipefail
          git tag --force "${RELEASE_TAG}" "${RELEASE_COMMIT}"
          git push --force origin "refs/tags/${RELEASE_TAG}"
          notes="IPv6/DNS leak-prevention build, updated in place on 2026-11-07.

          - Keeps the existing IPv6 and DNS leak-prevention changes.
          - Fixes the panel update lock remaining busy after a failed updater process or systemd unit exits without writing a final status.
          - Allows an immediate retry after the failed updater has actually stopped.
          - Includes regression tests and a Go race test for the update-lock state.
          - dev-latest remains frozen at dev+6d205a91."
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TAG}" --notes "${notes}" \
            --latest=true --prerelease=false
          gh release upload "${RELEASE_TAG}" release-artifacts/*/* \
            --repo "${GITHUB_REPOSITORY}" --clobber
          test "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')" -eq 16
          test "$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | cut -f1)" = "${RELEASE_COMMIT}"
          gh release delete "${STAGING_TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
