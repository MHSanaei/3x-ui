name: Align 3x-ui update tags once

on:
  push:
    paths:
      - .github/workflows/finalize-3x-ui-20261110-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 155e2b0e5cf078a9d2e17e41c242e35dc02bee59
      RELEASE_TAG: 3x-ui-20261110
    steps:
      - name: Align dated release and compatibility update tag
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/dev-latest"             -f sha="$SOURCE_SHA" -F force=true >/dev/null
          gh release edit "$RELEASE_TAG" --target "$SOURCE_SHA"
          gh release edit dev-latest --target "$SOURCE_SHA" --prerelease --latest=false             --title "Update channel: $RELEASE_TAG"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GH_REPO/git/ref/tags/dev-latest" --jq .object.sha)" = "$SOURCE_SHA"
