name: Publish 3x-ui-20261111 once

on:
  push:
    paths:
      - .github/workflows/publish-3x-ui-20261111-once.yml

permissions:
  actions: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: d033efee5f6ca024ffa6902f67b4c9275e8cf539
      RELEASE_TAG: 3x-ui-20261111
    steps:
      - name: Create draft and dispatch tested dated release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft \
            --title "$RELEASE_TAG" \
            --notes "Verified update based on the preserved dev+6d205a91 line. Promotes freshly verified SSTP residential/native-datacenter resources into isolated VPS-managed SOCKS exits usable from normal 3x-ui subscriptions without client TUN mode. TCP, UDP, DNS, IPv6 and WebRTC leak boundaries fail closed; xnvgatebox stable exits remain a separate category. Pins tested xnvgatebox v0.9.8. Upgrade and rollback instructions are documented in the repository. The immutable backup remains dev-6d205a91-backup."
          gh workflow run release.yml --ref main -f source_ref="$SOURCE_SHA" -f release_tag="$RELEASE_TAG"
          sleep 10
          RUN_ID="$(gh run list --workflow release.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          echo "3x-ui release run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status
