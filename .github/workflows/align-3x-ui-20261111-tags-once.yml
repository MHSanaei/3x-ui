name: Align 3x-ui-20261111 update tags once

on:
  push:
    paths:
      - .github/workflows/align-3x-ui-20261111-tags-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 268af2ec8eb16c3a7ee50268a3255667e59a9103
      BACKUP_SHA: 6d205a91bd8b0dac38077e78db5d9990fb12cc48
    steps:
      - name: Align dated and compatibility tags without touching backup
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh api "repos/$GH_REPO/git/ref/tags/dev-6d205a91-backup" --jq '.object.sha')"
          [[ "$before" == "$BACKUP_SHA" ]]
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/3x-ui-20261111" -f sha="$SOURCE_SHA" -F force=true >/dev/null
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/dev-latest" -f sha="$SOURCE_SHA" -F force=true >/dev/null
          gh release edit 3x-ui-20261111 --target "$SOURCE_SHA" --draft=false --prerelease=false --latest
          gh release edit dev-latest --target "$SOURCE_SHA" --prerelease --latest=false
          after="$(gh api "repos/$GH_REPO/git/ref/tags/dev-6d205a91-backup" --jq '.object.sha')"
          [[ "$after" == "$BACKUP_SHA" ]]
