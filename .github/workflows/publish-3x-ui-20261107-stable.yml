name: Clean accidental main release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-3x-ui-20261107-stable.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: remove accidental main release' }}"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove accidental release and tag
        run: |
          set -euo pipefail
          gh release delete main --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          ! gh release view main --repo "${GITHUB_REPOSITORY}"
